[package]
name = "image-viewer"
version = "0.1.0"
edition = "2024"
description = "Windows Image Viewer: a fast, minimal viewer for pixel art and photos"
repository = "https://github.com/GrowlDev/windows-image-viewer"
publish = false

[[bin]]
name = "imageviewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff", "tga", "qoi"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Decoding speed matters even in debug builds.
[profile.dev.package."*"]
opt-level = 3
